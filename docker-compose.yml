version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: spoony-postgres
    environment:
      POSTGRES_DB: spoony_dev
      POSTGRES_USER: spoony
      POSTGRES_PASSWORD: spoony_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoony"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: spoony-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  postgres_data: