version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: spoony-postgres
    environment:
      POSTGRES_DB: spoony_dev
      POSTGRES_USER: spoony
      POSTGRES_PASSWORD: spoony_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoony -d spoony_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: spoony-backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/spoony_dev
      DATABASE_USER: spoony
      DATABASE_PASSWORD: spoony_dev_password
      JWT_SECRET: dev-secret-key-change-this-in-production-minimum-256-bits-xxxxxxxxxxxxxxxxxxxx
      JWT_EXPIRATION: 86400000
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: spoony-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  postgres_data:
