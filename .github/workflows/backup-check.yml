name: Check production backup

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  freshness:
    name: Require a database dump newer than 36 hours
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-3

      - name: Check newest encrypted dump
        env:
          ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
        run: |
          set -Eeuo pipefail
          test -n "$ARTIFACT_BUCKET"
          latest=$(aws s3api list-objects-v2 \
            --bucket "$ARTIFACT_BUCKET" \
            --prefix backups/database/ \
            --query 'sort_by(Contents,&LastModified)[-1].LastModified' \
            --output text)
          [[ "$latest" != "None" ]]
          age_seconds=$(( $(date -u +%s) - $(date -u -d "$latest" +%s) ))
          if (( age_seconds > 129600 )); then
            echo "Newest database backup is older than 36 hours: $latest" >&2
            exit 1
          fi
          echo "Newest database backup is fresh: $latest"
