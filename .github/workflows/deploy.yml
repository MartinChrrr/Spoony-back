name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# OIDC: request a token to assume the AWS deploy role; read the repo contents.
permissions:
  id-token: write
  contents: read

# Serialise deploys on the same ref (do not cancel a running deploy: an aborted
# ECS rollout could leave the service half-updated).
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  CONTAINER_NAME: app
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Build, scan and deploy
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # Build locally (load into the runner's Docker) but do NOT push yet: the
      # Trivy scan below gates the push.
      - name: Build Docker image (no push)
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          IMAGE_SHA="${REGISTRY}/${REPOSITORY}:${SOURCE_SHA}"
          IMAGE_SHORT="${REGISTRY}/${REPOSITORY}:sha-${SOURCE_SHA::7}"
          docker build -t "$IMAGE_SHA" -t "$IMAGE_SHORT" .
          echo "IMAGE_SHA=$IMAGE_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_SHORT=$IMAGE_SHORT" >> "$GITHUB_ENV"

      # GATING: fail the job on any fixable CRITICAL/HIGH vulnerability.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ env.IMAGE_SHA }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Push image to ECR
        run: |
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_SHORT"

      # Pull the live task definition so we only swap the image, preserving every
      # other field (env, secrets, roles) managed by Terraform.
      - name: Download current task definition
        run: |
          PREVIOUS_TASK_DEFINITION="$(aws ecs describe-task-definition \
            --task-definition "${{ secrets.ECS_TASK_FAMILY }}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "PREVIOUS_TASK_DEFINITION=$PREVIOUS_TASK_DEFINITION" >> "$GITHUB_ENV"
          PREVIOUS_DESIRED_COUNT="$(aws ecs describe-services \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}" \
            --query 'services[0].desiredCount' \
            --output text)"
          echo "PREVIOUS_DESIRED_COUNT=$PREVIOUS_DESIRED_COUNT" >> "$GITHUB_ENV"
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.ECS_TASK_FAMILY }}" \
            --query 'taskDefinition' \
            --output json > task-definition.json

      - name: Render new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_SHA }}

      - name: Deploy to ECS
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Scale service after first real deployment
        id: scale
        env:
          DESIRED_COUNT: ${{ vars.ECS_DESIRED_COUNT || '1' }}
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --desired-count "$DESIRED_COUNT" >/dev/null
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}"

      - name: HTTPS smoke test
        id: smoke
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          test -n "$API_BASE_URL"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              "${API_BASE_URL%/}/actuator/health/readiness"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Roll back failed rollout
        if: >-
          failure() &&
          (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --task-definition "$PREVIOUS_TASK_DEFINITION" \
            --desired-count "$PREVIOUS_DESIRED_COUNT" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}"
