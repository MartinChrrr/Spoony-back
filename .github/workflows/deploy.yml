name: Deploy EC2

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ec2-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Build ARM64, scan and deploy through SSM
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build immutable ARM64 image archive
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          tags: spoony-backend:${{ env.SOURCE_SHA }}
          outputs: type=docker,dest=/tmp/backend-image.tar
          cache-from: type=gha,scope=spoony-backend-arm64
          cache-to: type=gha,mode=max,scope=spoony-backend-arm64

      - name: Scan image archive with Trivy
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          input: /tmp/backend-image.tar
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Assemble deployment bundle
        run: |
          set -Eeuo pipefail
          install -d release
          gzip -9 /tmp/backend-image.tar
          mv /tmp/backend-image.tar.gz release/backend-image.tar.gz
          cp infra-ec2/docker-compose.production.yml infra-ec2/Caddyfile release/
          cp infra-ec2/scripts/deploy-release.sh release/
          cp infra-ec2/scripts/rollback-release.sh release/
          cp infra-ec2/scripts/backup-postgres.sh release/
          cp infra-ec2/scripts/spoony-backup.service release/
          cp infra-ec2/scripts/spoony-backup.timer release/
          tar -C release -czf /tmp/spoony-release.tar.gz .

      - name: Upload immutable deployment bundle
        env:
          ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
        run: |
          set -Eeuo pipefail
          test -n "$ARTIFACT_BUCKET"
          aws s3 cp /tmp/spoony-release.tar.gz \
            "s3://${ARTIFACT_BUCKET}/releases/${SOURCE_SHA}/spoony-release.tar.gz" \
            --sse AES256 --only-show-errors

      - name: Deploy on EC2 through Systems Manager
        id: deploy
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ARTIFACT_BUCKET: ${{ vars.AWS_ARTIFACT_BUCKET }}
          PARAMETER_PREFIX: ${{ vars.AWS_PARAMETER_PREFIX }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        run: |
          set -Eeuo pipefail
          test -n "$INSTANCE_ID"
          test -n "$ARTIFACT_BUCKET"
          test -n "$PARAMETER_PREFIX"
          test -n "$API_DOMAIN"
          test -n "$ACME_EMAIL"
          test -n "$CORS_ALLOWED_ORIGINS"

          cat > /tmp/remote-command.sh <<EOF
          set -Eeuo pipefail
          release_dir="/opt/spoony/releases/${SOURCE_SHA}"
          install -d -m 0755 "\$release_dir"
          aws s3 cp "s3://${ARTIFACT_BUCKET}/releases/${SOURCE_SHA}/spoony-release.tar.gz" /tmp/spoony-release.tar.gz --region "${AWS_REGION}" --only-show-errors
          tar -C "\$release_dir" -xzf /tmp/spoony-release.tar.gz
          chmod 0755 "\$release_dir/deploy-release.sh"
          "\$release_dir/deploy-release.sh" "\$release_dir" "spoony-backend:${SOURCE_SHA}" "${AWS_REGION}" "${ARTIFACT_BUCKET}" "${PARAMETER_PREFIX}" "${API_DOMAIN}" "${ACME_EMAIL}" "${CORS_ALLOWED_ORIGINS}"
          EOF
          jq -Rs '{commands: [.]}' /tmp/remote-command.sh > /tmp/ssm-parameters.json

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Spoony ${SOURCE_SHA}" \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"
                exit 1
                ;;
            esac
            sleep 10
          done
          [[ "$status" == "Success" ]]
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' --output json

      - name: HTTPS smoke test
        id: smoke
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -Eeuo pipefail
          test -n "$API_BASE_URL"
          for _ in $(seq 1 18); do
            if curl --fail --silent --show-error \
              "${API_BASE_URL%/}/actuator/health/readiness"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Roll back application after failed public smoke test
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["/opt/spoony/rollback-release.sh"]' \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
