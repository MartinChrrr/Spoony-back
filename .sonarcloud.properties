# The Flyway scripts are immutable deployment artifacts. Keep them out of the
# generic PL/SQL checks that produce false positives for PostgreSQL migrations,
# while preserving analysis of the Java application code.
sonar.issue.ignore.multicriteria=flywayV8Update,flywayV9Update,postgresVarchar,seedLiteral,dynamicSql

sonar.issue.ignore.multicriteria.flywayV8Update.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.flywayV8Update.resourceKey=src/main/resources/db/migration/V8__protect_task_history_and_spoons.sql

sonar.issue.ignore.multicriteria.flywayV9Update.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.flywayV9Update.resourceKey=src/main/resources/db/migration/V9__harden_inputs_and_queries.sql

sonar.issue.ignore.multicriteria.postgresVarchar.ruleKey=plsql:VarcharUsageCheck
sonar.issue.ignore.multicriteria.postgresVarchar.resourceKey=src/main/resources/db/migration/V1__create_schema.sql

sonar.issue.ignore.multicriteria.seedLiteral.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.seedLiteral.resourceKey=src/main/resources/db/migration/V2__seed_data.sql

# PostgreSQL identifiers cannot be bound as JDBC parameters. The migration
# runner validates identifiers and quotes both identifiers and literals before
# assembling these fixed GRANT/ROLE statements.
sonar.issue.ignore.multicriteria.dynamicSql.ruleKey=java:S2077
sonar.issue.ignore.multicriteria.dynamicSql.resourceKey=src/main/java/com/spoony/backend/infrastructure/migration/DatabaseMigrationApplication.java

# Seed rows are intentionally repetitive data, not duplicated application code.
sonar.cpd.exclusions=src/main/resources/db/migration/V2__seed_data.sql
