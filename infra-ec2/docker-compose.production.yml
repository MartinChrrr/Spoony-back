name: spoony

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - /srv/spoony/postgres:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 640m
    cpus: 0.70
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  migration:
    image: ${APP_IMAGE}
    pull_policy: never
    profiles: ["migration"]
    entrypoint: ["java"]
    command:
      - "-cp"
      - "app.jar"
      - "-Dloader.main=com.spoony.backend.infrastructure.migration.DatabaseMigrationApplication"
      - "org.springframework.boot.loader.launch.PropertiesLauncher"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATABASE_ADMIN_USER: ${DB_ADMIN_USER}
      DATABASE_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      DATABASE_MIGRATION_USER: ${DB_MIGRATION_USER}
      DATABASE_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DATABASE_APP_USER: ${DB_APP_USER}
      DATABASE_APP_PASSWORD: ${DB_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 640m
    cpus: 0.80
    pids_limit: 200
    logging: *default-logging

  app:
    image: ${APP_IMAGE}
    pull_policy: never
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_FLYWAY_ENABLED: "false"
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATABASE_USER: ${DB_APP_USER}
      DATABASE_PASSWORD: ${DB_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: "900000"
      JWT_REFRESH_EXPIRATION: "604800000"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      BUSINESS_TIME_ZONE: Europe/Paris
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - database
      - proxy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=96m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 900m
    cpus: 1.20
    pids_limit: 300
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 90s
    logging: *default-logging

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/spoony/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/spoony/caddy-data:/data
      - /srv/spoony/caddy-config:/config
    networks:
      - proxy
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.20
    pids_limit: 100
    logging: *default-logging

networks:
  database:
    internal: true
  proxy:
