spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/spoony_dev
    username: spoony
    password: spoony_dev_password
  
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

jwt:
  secret: dev-secret-key-min-256-bits-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  access-expiration: 900000
  refresh-expiration: 604800000

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8081,http://localhost:19006

logging:
  level:
    com.spoony: DEBUG
    org.springframework.security: DEBUG