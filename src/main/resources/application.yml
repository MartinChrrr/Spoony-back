spring:
  application:
    name: spoony-backend
  
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  # V0 is scoped to France: every server-side "today" uses this single IANA
  # zone, independently from the host/container timezone.
  business-time-zone: ${BUSINESS_TIME_ZONE:Europe/Paris}
  http:
    max-request-size-bytes: ${MAX_REQUEST_SIZE_BYTES:262144}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
